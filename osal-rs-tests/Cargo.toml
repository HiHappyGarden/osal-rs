[package]
name = "osal-rs-tests"
version = "1.2.0"
edition = "2024"
authors = ["Antonio Salsi"]
description = "Test suite for osal-rs"
license = "LGPL-2.1-or-later"
repository = "https://github.com/antoniosalsi/osal-rs"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = ["freertos"]
freertos = ["osal-rs/freertos"]
posix = ["osal-rs/posix"]
serde = ["osal-rs/serde", "dep:osal-rs-serde"]
async = ["osal-rs/async"]

[dependencies]
osal-rs = { version = "1.0", path = "../osal-rs" }
# Needed to build payload types that deliberately fail to (de)serialize, so
# `QueueStreamed`'s error paths can be reached. Mirrors the dev-dependency the
# `osal-rs` crate carries for its own `tests/`.
osal-rs-serde = { version = "1.0", path = "../osal-rs-serde", features = ["derive"], optional = true }