[package]
name = "osal-rs-tests"
version = "1.0.3"
edition = "2024"
authors = ["Antonio Salsi"]
description = "Test suite for osal-rs"
license = "LGPL-2.1-or-later"
repository = "https://github.com/antoniosalsi/osal-rs"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = ["freertos"]
freertos = ["osal-rs/freertos"]
posix = ["osal-rs/posix"]
serde = ["osal-rs/serde"]
async = ["osal-rs/async"]

[dependencies]
osal-rs = { version = "1.0", path = "../osal-rs" }