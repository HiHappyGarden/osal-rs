[package]
name = "osal-rs"
version = "1.0.3"
edition = "2024"
rust-version = "1.85.0"
authors = ["Antonio Salsi"]
description = "Operating System Abstraction Layer for Rust with support for FreeRTOS and POSIX"
license = "LGPL-2.1-or-later"
repository = "https://github.com/HiHappyGarden/osal-rs"
homepage = "https://github.com/HiHappyGarden/osal-rs"
documentation = "https://docs.rs/osal-rs"
readme = "../README.md"
keywords = ["os", "rtos", "freertos", "embedded", "posix"]
categories = ["embedded", "no-std", "os"]
exclude = [
    "target/",
    ".git/",
    ".github/",
    "*.swp",
    "*.swo",
]

[package.metadata.docs.rs]

# Features to pass to Cargo (default: [])
features = ["posix", "async", "serde"]

# Whether to pass `--no-default-features` to Cargo (default: false)
no-default-features = true

# Target to test build on, used as the default landing page (default: "x86_64-unknown-linux-gnu")
#
# Any target supported by rustup can be used.
default-target = "x86_64-unknown-linux-gnu"

# Targets to build (default: see below)
#
# Any target supported by rustup can be used.
#
# Default targets:
# - x86_64-unknown-linux-gnu
# - aarch64-apple-darwin
# - x86_64-pc-windows-msvc
# - aarch64-unknown-linux-gnu
# - i686-pc-windows-msvc
#
# Set this to `[]` to only build the default target.
#
# If `default-target` is unset, the first element of `targets` is treated as the default target.
# Otherwise, these `targets` are built in addition to the default target.
# If both `default-target` and `targets` are unset,
#   all tier-one targets will be built and `x86_64-unknown-linux-gnu` will be used as the default target.
targets = []

# Additional `RUSTDOCFLAGS` to set (default: [])
rustdoc-args = []

[lib]
crate-type = ["staticlib", "rlib"]


[features]
freertos = ["osal-rs-build/freertos"]
posix = ["osal-rs-build/posix"]
serde = ["osal-rs-serde"]
async = []
# POSIX: schedule spawned threads with the real-time SCHED_FIFO policy
# instead of inheriting the creating thread's scheduling policy/priority.
# automatically enabled on compile time
real_time = []


[dependencies]
osal-rs-serde = { version = "1.0", path = "../osal-rs-serde", features = ["derive"], optional = true }

[build-dependencies]
osal-rs-build = { version = "1.0", path = "../osal-rs-build", default-features = false }


[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"